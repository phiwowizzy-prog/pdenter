<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voice to Text — LexiCount Pro</title>
  <meta name="description" content="Speak and transcribe live with a built-in voice dictation mode. Uses the Web Speech API where available.">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/">LexiCount Pro™</a></div></header>
  <main class="container">
    <h1>Voice to Text</h1>
    <p class="muted">Click the microphone and start dictating. Automatic punctuation where supported.</p>
    <textarea id="vt-text" placeholder="Your dictation will appear here"></textarea>
    <div class="widget-actions"><button id="vt-mic">Start/Stop</button></div>
  </main>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
