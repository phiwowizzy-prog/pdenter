<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word Counter — LexiCount Pro</title>
  <meta name="description" content="Live word counter: words, characters, sentences, paragraphs, reading & speaking time — instant and private, runs in your browser.">
  <link rel="stylesheet" href="/assets/css/styles.css">

  <!-- Google AdSense (publisher ID added) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-8581996512005206" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/">LexiCount Pro™</a></div></header>
  <main class="container">
    <h1>Word Counter</h1>
    <p class="muted">Live — no submit button. Useful for essays, social posts, and reports.</p>

    <!-- Tool-level ad (below heading) -->
    <div role="complementary" aria-label="Advertisement" style="margin:12px 0 18px;">
      <p class="muted" style="font-size:12px;margin:0 0 8px;">Advertisement</p>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="pub-8581996512005206"
           data-ad-slot="0000001000"
           data-ad-format="auto"></ins>
    </div>

    <textarea id="wc-text" placeholder="Paste or type your text here"></textarea>
    <div class="stats" id="wc-stats">
      <div class="stat"><strong id="wc-words">0</strong><span>Words</span></div>
      <div class="stat"><strong id="wc-chars">0</strong><span>Characters</span></div>
      <div class="stat"><strong id="wc-chars-nospace">0</strong><span>Chars (no spaces)</span></div>
      <div class="stat"><strong id="wc-sentences">0</strong><span>Sentences</span></div>
      <div class="stat"><strong id="wc-paragraphs">0</strong><span>Paragraphs</span></div>
      <div class="stat"><strong id="wc-reading">0</strong><span>Reading min</span></div>
    </div>
    <div class="widget-actions">
      <button id="wc-download">Download .txt</button>
      <button id="wc-copy">Copy</button>
    </div>
  </main>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
